<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Red Ball 3 - Landscape Edition</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: Arial, sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* El contenedor del juego ocupa TODA la pantalla de fondo */
        #game-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #ruffle {
            width: 100%;
            height: 100%;
        }

        /* CONTROL IZQUIERDO (Flechas) fijo abajo a la izquierda */
        #control-left-side {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 20px;
            z-index: 10;
        }

        /* CONTROL DERECHO (Salto) fijo abajo a la derecha */
        #control-right-side {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 10;
        }

        /* Diseño de los botones táctiles */
        .btn {
            width: 80px;
            height: 80px;
            background-color: rgba(51, 51, 51, 0.5); /* Semi-transparente para ver el mapa */
            color: rgba(255, 255, 255, 0.8);
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            font-size: 32px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }

        /* Efecto visual al mantener presionado */
        .btn:active {
            background-color: rgba(255, 255, 255, 0.4);
            border-color: #fff;
            color: #000;
        }

        #btn-jump {
            width: 90px;
            height: 90px;
            background-color: rgba(255, 87, 34, 0.5); /* Naranja transparente */
            border-color: rgba(255, 112, 67, 0.4);
        }

        #btn-jump:active {
            background-color: rgba(255, 87, 34, 0.8);
        }
    </style>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>

    <div id="game-container">
        <div id="ruffle"></div>
    </div>

    <div id="control-left-side">
        <div id="btn-left" class="btn">◀</div>
        <div id="btn-right" class="btn">▶</div>
    </div>

    <div id="control-right-side">
        <div id="btn-jump" class="btn">▲</div>
    </div>

    <script>
        let player = null;

        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            "allowScriptAccess": true,
            "forceScale": true,
            "forceAlign": true,
            "quality": "high",
            "autoplay": "on",
            "unmuteOverlay": "hidden",
            "letterbox": "fullscreen" 
        };

        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            player = ruffle.createPlayer();
            const container = document.getElementById("ruffle");
            container.appendChild(player);
            
            player.load({
                url: "redball3.swf",
                allowScriptAccess: true
            });
        });

        // Función para simular teclas y quitar el botón gigante de Ruffle
        function simulateKey(keyCode, keyName, eventType) {
            // Si el juego está pausado por el navegador, el primer toque lo arranca sí o sí
            if (player && typeof player.play === "function") {
                player.play();
            }

            const event = new KeyboardEvent(eventType, {
                key: keyName,
                code: keyName,
                keyCode: keyCode,
                which: keyCode,
                bubbles: true,
                cancelable: true
            });
            document.dispatchEvent(event);
        }

        function setupButton(id, keyCode, keyName) {
            const btn = document.getElementById(id);
            
            btn.addEventListener("touchstart", (e) => {
                e.preventDefault();
                simulateKey(keyCode, keyName, "keydown");
            });

            btn.addEventListener("touchend", (e) => {
                e.preventDefault();
                simulateKey(keyCode, keyName, "keyup");
            });
        }

        setupButton("btn-left", 37, "ArrowLeft");
        setupButton("btn-right", 39, "ArrowRight");
        setupButton("btn-jump", 38, "ArrowUp");

        // "Despertador" extra si tocan cualquier zona de la pantalla vacía
        document.addEventListener("touchstart", () => {
            if (player && typeof player.play === "function") {
                player.play();
            }
        });
    </script>

</body>
</html>
