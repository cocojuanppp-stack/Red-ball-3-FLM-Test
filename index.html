<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Red Ball 3 - Ultimate Fullscreen</title>
    <style>
        /* Forzamos a la página a ocupar absolutamente todo el celular sin márgenes */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Contenedor del juego de fondo: Estirado completo */
        #game-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #ruffle {
            width: 100%;
            height: 100%;
        }

        /* Capa de controles: Forzada a estar SIEMPRE por encima (z-index altísimo) */
        #controls-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999999; /* Nada puede tapar esto */
            pointer-events: none; /* Deja pasar los clics al juego si es necesario */
        }

        /* Posicionamiento de las flechas (Izquierda) */
        #control-left-side {
            position: absolute;
            bottom: 25px;
            left: 25px;
            display: flex;
            gap: 20px;
            pointer-events: auto;
        }

        /* Posicionamiento del Salto (Derecha) */
        #control-right-side {
            position: absolute;
            bottom: 25px;
            right: 25px;
            pointer-events: auto;
        }

        /* Estilo de botones limpios y responsivos */
        .btn {
            width: 85px;
            height: 85px;
            background-color: rgba(40, 40, 40, 0.5);
            color: rgba(255, 255, 255, 0.8);
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            font-size: 34px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            box-shadow: 0 4px rgba(0,0,0,0.3);
        }

        .btn:active {
            background-color: rgba(255, 255, 255, 0.5);
            border-color: #fff;
            color: #000;
        }

        #btn-jump {
            width: 95px;
            height: 95px;
            background-color: rgba(255, 87, 34, 0.5);
            border-color: rgba(255, 112, 67, 0.4);
        }

        #btn-jump:active {
            background-color: rgba(255, 87, 34, 0.8);
        }
    </style>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>

    <div id="game-container">
        <div id="ruffle"></div>
    </div>

    <div id="controls-layer">
        <div id="control-left-side">
            <div id="btn-left" class="btn">◀</div>
            <div id="btn-right" class="btn">▶</div>
        </div>

        <div id="control-right-side">
            <div id="btn-jump" class="btn">▲</div>
        </div>
    </div>

    <script>
        let player = null;

        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            "allowScriptAccess": true,
            "forceScale": true,
            "forceAlign": true,
            "quality": "high",
            "autoplay": "on",
            "unmuteOverlay": "hidden",
            "letterbox": "fullscreen" /* Esto elimina las franjas negras estirando el SWF */
        };

        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            player = ruffle.createPlayer();
            const container = document.getElementById("ruffle");
            container.appendChild(player);
            
            player.load({
                url: "redball3.swf",
                allowScriptAccess: true
            });
        });

        // Activa el juego y solicita pantalla completa nativa al navegador al primer toque
        function activarPantallaCompleta() {
            if (player && typeof player.play === "function") {
                player.play();
            }
            
            // Intenta ocultar de forma nativa la barra de direcciones de Chrome/WebView
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log("Esperando interacción para pantalla completa nativa...");
                });
            }
        }

        function simulateKey(keyCode, keyName, eventType) {
            activarPantallaCompleta();

            const event = new KeyboardEvent(eventType, {
                key: keyName,
                code: keyName,
                keyCode: keyCode,
                which: keyCode,
                bubbles: true,
                cancelable: true
            });
            document.dispatchEvent(event);
        }

        function setupButton(id, keyCode, keyName) {
            const btn = document.getElementById(id);
            
            btn.addEventListener("touchstart", (e) => {
                e.preventDefault();
                simulateKey(keyCode, keyName, "keydown");
            });

            btn.addEventListener("touchend", (e) => {
                e.preventDefault();
                simulateKey(keyCode, keyName, "keyup");
            });
        }

        setupButton("btn-left", 37, "ArrowLeft");
        setupButton("btn-right", 39, "ArrowRight");
        setupButton("btn-jump", 38, "ArrowUp");

        // Cualquier toque en la pantalla despierta el juego y estira el HTML
        document.addEventListener("touchstart", () => {
            activarPantallaCompleta();
        });
    </script>

</body>
</html>
