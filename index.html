<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Red Ball 3 - Fullscreen Absolute Edition</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: Arial, sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
        }

        /* El contenedor del juego ahora ocupa TODO el tamaño del celular */
        #game-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1; /* Queda al fondo */
        }

        #ruffle {
            width: 100%;
            height: 100%;
        }

        /* Controles flotantes transparentes ENCIMA del juego */
        #controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            box-sizing: border-box;
            z-index: 10; /* Queda por encima del juego */
            pointer-events: none; /* No estorba los clics del fondo */
        }

        .d-pad {
            display: flex;
            gap: 30px;
            pointer-events: auto;
        }

        .btn-wrapper {
            pointer-events: auto;
        }

        .btn {
            width: 90px;
            height: 90px;
            background-color: rgba(68, 68, 68, 0.6); /* Transparente para ver el juego detrás */
            color: rgba(255, 255, 255, 0.8);
            border: 4px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            font-size: 38px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            box-shadow: 0 4px rgba(0, 0, 0, 0.4);
        }

        .btn:active {
            background-color: rgba(255, 255, 255, 0.4);
            border-color: #fff;
            color: #000;
        }

        #btn-jump {
            width: 100px;
            height: 100px;
            background-color: rgba(255, 87, 34, 0.6); /* Naranja transparente */
            border-color: rgba(255, 112, 67, 0.5);
        }
        
        #btn-jump:active {
            background-color: rgba(255, 87, 34, 0.9);
        }
    </style>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>

    <div id="game-container">
        <div id="ruffle"></div>
    </div>

    <div id="controls">
        <div class="d-pad">
            <div id="btn-left" class="btn">◀</div>
            <div id="btn-right" class="btn">▶</div>
        </div>
        <div class="btn-wrapper">
            <div id="btn-jump" class="btn">▲</div>
        </div>
    </div>

    <script>
        let player = null;

        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            "allowScriptAccess": true,
            "forceScale": true,
            "forceAlign": true,
            "quality": "high",
            "autoplay": "on",
            "unmuteOverlay": "hidden", // Oculta carteles molestos
            "letterbox": "fullscreen"  // Fuerza a Ruffle a estirarse por completo
        };

        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            player = ruffle.createPlayer();
            const container = document.getElementById("ruffle");
            container.appendChild(player);
            
            player.load({
                url: "redball3.swf",
                allowScriptAccess: true
            });
        });

        // Función para inyectar teclado y DESPERTAR el autoplay bloqueado por Chrome
        function simulateKey(keyCode, keyName, eventType) {
            // Truco maestro: si el juego está en pausa por culpa del navegador,
            // cualquier toque en los controles lo obligará a arrancar
            if (player && typeof player.play === "function" && eventType === "keydown") {
                player.play(); 
            }

            const event = new KeyboardEvent(eventType, {
                key: keyName,
                code: keyName,
                keyCode: keyCode,
                which: keyCode,
                bubbles: true,
                cancelable: true
            });
            document.dispatchEvent(event);
        }

        function setupButton(id, keyCode, keyName) {
            const btn = document.getElementById(id);
            
            btn.addEventListener("touchstart", (e) => {
                e.preventDefault();
                simulateKey(keyCode, keyName, "keydown");
            });

            btn.addEventListener("touchend", (e) => {
                e.preventDefault();
                simulateKey(keyCode, keyName, "keyup");
            });
        }

        setupButton("btn-left", 37, "ArrowLeft");
        setupButton("btn-right", 39, "ArrowRight");
        setupButton("btn-jump", 38, "ArrowUp");
    </script>

</body>
</html>
