<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Red Ball 3 - Fullscreen Touch Edition</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* El contenedor del juego ahora toma todo el espacio superior de forma óptima */
        #game-container {
            width: 100%;
            height: 70%; /* Le damos más espacio al juego */
            background-color: #000;
            position: relative;
        }

        #ruffle {
            width: 100%;
            height: 100%;
        }

        /* Controles mejor posicionados abajo */
        #controls {
            width: 100%;
            height: 30%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: #151515;
            padding: 10px;
            box-sizing: border-box;
            border-top: 2px solid #252525;
        }

        .d-pad {
            display: flex;
            gap: 25px;
        }

        .btn {
            width: 85px;
            height: 85px;
            background-color: #333;
            color: white;
            border: 4px solid #555;
            border-radius: 50%;
            font-size: 35px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            box-shadow: 0 6px #222;
        }

        .btn:active {
            background-color: #666;
            border-color: #fff;
            transform: translateY(4px);
            box-shadow: 0 2px #222;
        }

        #btn-jump {
            width: 95px;
            height: 95px;
            background-color: #ff5722;
            border-color: #ff7043;
            box-shadow: 0 6px #b33c15;
        }
        
        #btn-jump:active {
            background-color: #ff8a65;
            box-shadow: 0 2px #b33c15;
        }
    </style>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>

    <div id="game-container">
        <div id="ruffle"></div>
    </div>

    <div id="controls">
        <div class="d-pad">
            <div id="btn-left" class="btn">◀</div>
            <div id="btn-right" class="btn">▶</div>
        </div>
        <div id="btn-jump" class="btn">▲</div>
    </div>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            "allowScriptAccess": true,
            "forceScale": true,
            "forceAlign": true,
            "quality": "high",
            "autoplay": "on", // <-- ACTIVA EL AUTOPLAY TOTAL DE RUFFLE
            "unmuteOverlay": "hidden", // Oculta cualquier aviso molesto de sonido
            "letterbox": "on"
        };

        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("ruffle");
            container.appendChild(player);
            
            player.load({
                url: "redball3.swf",
                autoplay: true, // Forzar inicio automático
                allowScriptAccess: true
            });

            // Auto-ajustar a pantalla completa interna en el reproductor
            player.style.width = "100%";
            player.style.height = "100%";
        });

        // Simulador de pulsación de teclado
        function simulateKey(keyCode, keyName, eventType) {
            const event = new KeyboardEvent(eventType, {
                key: keyName,
                code: keyName,
                keyCode: keyCode,
                which: keyCode,
                bubbles: true,
                cancelable: true
            });
            document.dispatchEvent(event);
        }

        function setupButton(id, keyCode, keyName) {
            const btn = document.getElementById(id);
            
            btn.addEventListener("touchstart", (e) => {
                e.preventDefault();
                simulateKey(keyCode, keyName, "keydown");
            });

            btn.addEventListener("touchend", (e) => {
                e.preventDefault();
                simulateKey(keyCode, keyName, "keyup");
            });
        }

        setupButton("btn-left", 37, "ArrowLeft");
        setupButton("btn-right", 39, "ArrowRight");
        setupButton("btn-jump", 38, "ArrowUp");
    </script>

</body>
</html>
